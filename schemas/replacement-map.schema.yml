"$schema": https://json-schema.org/draft/2020-12/schema
"$id": https://schemas.synthesize-regions.dev/replacement-map.schema.json
title: synthesize-regions ReplacementMap
description: Structural JSON Schema for ReplacementMap values. Marker arity/type compatibility, raw TypeScript syntax, and security policy validation are enforced by the synthesize-regions API.
type: object
propertyNames:
  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
additionalProperties:
  "$ref": "#/$defs/replacementValue"
"$defs":
  replacementValue:
    oneOf:
      - "$ref": "#/$defs/replacement"
      - type: array
        minItems: 1
        items:
          "$ref": "#/$defs/replacement"

  replacement:
    oneOf:
      - "$ref": "#/$defs/identifierReplacement"
      - "$ref": "#/$defs/expressionReplacement"
      - "$ref": "#/$defs/expressionSuffixReplacement"
      - "$ref": "#/$defs/statementReplacement"
      - "$ref": "#/$defs/arrayReplacement"
      - "$ref": "#/$defs/objectReplacement"
      - "$ref": "#/$defs/objectPropertyReplacement"
      - "$ref": "#/$defs/stringReplacement"
      - "$ref": "#/$defs/numberReplacement"
      - "$ref": "#/$defs/booleanReplacement"
      - "$ref": "#/$defs/nullReplacement"

  replacementExpression:
    oneOf:
      - "$ref": "#/$defs/identifierReplacement"
      - "$ref": "#/$defs/expressionReplacement"
      - "$ref": "#/$defs/arrayReplacement"
      - "$ref": "#/$defs/objectReplacement"
      - "$ref": "#/$defs/stringReplacement"
      - "$ref": "#/$defs/numberReplacement"
      - "$ref": "#/$defs/booleanReplacement"
      - "$ref": "#/$defs/nullReplacement"

  identifierName:
    type: string
    pattern: ^[$A-Za-z_][$A-Za-z0-9_]*$

  identifierReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - name
    properties:
      kind:
        const: identifier
      name:
        "$ref": "#/$defs/identifierName"

  expressionReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - code
    properties:
      kind:
        const: expression
      code:
        type: string
        minLength: 1

  statementReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - code
    properties:
      kind:
        const: statement
      code:
        type: string
        minLength: 1

  arrayReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - elements
    properties:
      kind:
        const: array
      elements:
        type: array
        items:
          "$ref": "#/$defs/replacementExpression"

  objectReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - properties
    properties:
      kind:
        const: object
      properties:
        type: object
        additionalProperties:
          "$ref": "#/$defs/replacementExpression"

  objectPropertyReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - name
      - value
    properties:
      kind:
        const: objectProperty
      name:
        type: string
        minLength: 1
      value:
        "$ref": "#/$defs/replacementExpression"
      computed:
        type: boolean

  stringReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - value
    properties:
      kind:
        const: string
      value:
        type: string

  numberReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - value
    properties:
      kind:
        const: number
      value:
        type: number

  booleanReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - value
    properties:
      kind:
        const: boolean
      value:
        type: boolean

  nullReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
    properties:
      kind:
        const: "null"

  expressionSuffixReplacement:
    type: object
    additionalProperties: false
    required:
      - kind
      - code
    properties:
      kind:
        const: expressionSuffix
      code:
        type: string
        minLength: 1