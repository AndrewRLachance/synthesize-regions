"$schema": https://json-schema.org/draft/2020-12/schema
"$id": https://schemas.synthesize-regions.dev/synthesis-graph.schema.json
title: synthesize-regions SynthesisGraph
description: Structural JSON Schema for SynthesisGraph values. Template existence, port compatibility, graph cycles, literal schemas, raw-code policies, and final output validation are enforced by the synthesize-regions API.
"$ref": "#/$defs/synthesisGraph"
"$defs":
  synthesisGraph:
    type: object
    additionalProperties: false
    required:
      - nodes
      - finalNodeId
    properties:
      nodes:
        type: array
        items:
          "$ref": "#/$defs/synthesisNode"
      finalNodeId:
        type: string
      goal:
        "$ref": "#/$defs/synthesisGoal"

  synthesisNode:
    type: object
    additionalProperties: false
    required:
      - id
      - templateId
      - inputs
    properties:
      id:
        type: string
      templateId:
        type: string
      inputs:
        type: object
        additionalProperties:
          "$ref": "#/$defs/synthesisInput"

  synthesisInput:
    oneOf:
      - "$ref": "#/$defs/literalInput"
      - "$ref": "#/$defs/refInput"
      - "$ref": "#/$defs/rawCodeInput"
      - "$ref": "#/$defs/inlineInput"
      - "$ref": "#/$defs/refShorthandInput"

  literalInput:
    type: object
    additionalProperties: false
    required:
      - kind
      - value
    properties:
      kind:
        const: literal
      value: true

  refInput:
    type: object
    additionalProperties: false
    required:
      - kind
      - nodeId
    properties:
      kind:
        const: ref
      nodeId:
        type: string

  rawCodeInput:
    type: object
    additionalProperties: false
    required:
      - kind
      - code
    properties:
      kind:
        const: rawCode
      code:
        type: string

  inlineInput:
    type: object
    additionalProperties: false
    required:
      - kind
      - node
    properties:
      kind:
        const: inline
      node:
        "$ref": "#/$defs/synthesisNode"

  refShorthandInput:
    type: object
    additionalProperties: false
    required:
      - "$ref"
    properties:
      "$ref":
        type: string

  synthesisGoal:
    type: object
    additionalProperties: false
    properties:
      outputKind:
        "$ref": "#/$defs/regionKind"
      type:
        "$ref": "#/$defs/typeDescriptor"
      schema: true

  typeDescriptor:
    type: object
    additionalProperties: false
    properties:
      ts:
        type: string
      schema: true

  regionKind:
    enum:
      - identifier
      - expression
      - expressionSuffix
      - statement
      - array
      - object
      - string
      - number
      - boolean
      - "null"
      - objectProperty